<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Body Bastion</title>
  <meta name="description" content="Body Bastion: a base-building strategy game about gut infections, immunity and antibiotics. Defend the gut. Learn the drugs.">
  <meta name="theme-color" content="#6b4425" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#3e2414" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bastion">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/battle.css">
  <link rel="stylesheet" href="/css/coc.css">
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('bb.pref.theme') || '"auto"');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage blocked */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/home" aria-label="Body Bastion home">
      <span class="brand-slot" id="brand-slot" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">Body Bastion</span>
        <span class="brand-tag">Defend the gut. Learn the drugs.</span>
      </span>
    </a>
    <nav class="topnav" id="topnav" aria-label="Main"></nav>
  </header>
  <main id="view" class="view" tabindex="-1" aria-live="polite">
    <div class="boot" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading Body Bastion...</span>
    </div>
  </main>
  <noscript>
    <div class="noscript">Body Bastion needs JavaScript. Please enable it in your browser settings and reload the page.</div>
  </noscript>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
