<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Bastion - offline</title>
<style>
  html,body{margin:0;height:100%;}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#5b2038,#1a0510 70%);
    font-family:system-ui,sans-serif;color:#fff;text-align:center;padding:24px;box-sizing:border-box;}
  .card{max-width:420px;background:#fff8e9;color:#3b2415;border:3px solid #3e2414;border-radius:18px;padding:22px 20px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 5px 0 #3e2414,0 18px 40px rgba(0,0,0,.5);}
  h1{font:900 24px "Trebuchet MS",system-ui,sans-serif;margin:8px 0 6px;}
  p{margin:0 0 16px;line-height:1.45;}
  a.btn{display:inline-block;padding:12px 26px;border-radius:14px;border:2px solid #1f5110;color:#fff;text-decoration:none;
    font:900 18px "Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#9be35c,#43a523);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #1f5110;
    text-shadow:-1px -1px 0 #2b170c,1px -1px 0 #2b170c,-1px 1px 0 #2b170c,1px 1px 0 #2b170c,0 2px 0 #2b170c;}
  .cell{width:64px;height:64px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 35% 30%,#ff6b6b,#d61f3c 55%,#7a0c1e);
    box-shadow:inset 0 0 0 12px rgba(90,0,15,.25);}
</style>
</head>
<body>
  <div class="card" role="alert">
    <div class="cell" aria-hidden="true"></div>
    <h1>Can't reach the gut</h1>
    <p>Body Bastion needs an internet connection. Check your Wi-Fi or mobile data, then try again. The free server can take up to a minute to wake up.</p>
    <a class="btn" href="bodybastion://retry">Try again</a>
  </div>
</body>
</html>
